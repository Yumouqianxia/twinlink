name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish from the selected ref, for example v0.0.2'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: twinlink-release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-aarch64
            bundles: app
          - os: macos-15-intel
            platform: darwin-x86_64
            bundles: app
          - os: windows-2022
            platform: windows-x86_64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/release.py validate
      - name: Test release tag protection
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: pnpm install --frozen-lockfile
      - run: python scripts/install_engine.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: cargo test -p twinlink-core --locked
      - run: cargo test -p twinlink --locked
      - name: Build signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: pnpm tauri build --ci --bundles ${{ matrix.bundles }}
      - name: Stage platform package
        run: python scripts/release.py stage --platform ${{ matrix.platform }}
      - name: Windows installed startup regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/windows-startup-smoke.ps1 -Tag "v$version" -InstallerPath $installer -RequireReady
          ./scripts/windows-startup-smoke.ps1 -Tag "v$version" -InstallerPath $installer -Scenario blocked-downloads -RequireReady
          ./scripts/windows-startup-smoke.ps1 -Tag "v$version" -InstallerPath $installer -Scenario corrupt-database -RequireReady
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-startup-results
          path: startup-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets/
          merge-multiple: true
      - name: Publish release, then advance GitHub-only update channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/release.py publish
