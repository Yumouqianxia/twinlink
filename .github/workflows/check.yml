name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pnpm install --frozen-lockfile
      - run: python scripts/install_engine.py
      - run: pnpm build
      - run: cargo test -p twinlink-core --locked
      - run: cargo test -p twinlink --locked
      - run: cargo check -p twinlink --locked
